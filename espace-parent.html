<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Parent — PASE CONNECT</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    :root {
      --primary-color: #198754;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    .btn-logout {
      background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
    }
    .card {
      background: var(--card-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px;
    }
    .card h3 {
      margin-top: 0; color: #212529; font-size: 1rem; border-bottom: 2px solid #e9ecef; padding-bottom: 8px;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: bold; font-size: 0.85rem; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 0.85rem;
    }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .btn {
      background: var(--primary-color); color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 0.9rem; cursor: pointer;
    }
    .btn-pdf {
      background-color: #0d6efd; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; margin-top: 10px;
    }
    
    @media print {
      body * { visibility: hidden; }
      #zone-bulletin-parent, #zone-bulletin-parent * { visibility: visible; }
      #zone-bulletin-parent { position: absolute; left: 0; top: 0; width: 100%; }
      .btn-pdf { display: none !important; }
    }
  </style>
</head>
<body>

  <header>
     <h1>PASE CONNECT — Espace Parent (Cloud)</h1>
     <button class="btn-logout" onclick="window.location.href='index.html'">Quitter</button>
  </header>

  <div class="card">
    <h3>🔍 Consultation du Bulletin de l'Enfant</h3>
    <div class="form-row">
      <div class="form-group">
        <label for="parent-search-eleve">Nom & Prénom de l'Enfant :</label>
        <input type="text" id="parent-search-eleve" placeholder="ex: Kouassi Marc">
      </div>
      <div class="form-group">
        <label for="parent-annee">Année Scolaire :</label>
        <select id="parent-annee">
          <option value="2025-2026">2025-2026</option>
          <option value="2026-2027" selected>2026-2027</option>
          <option value="2027-2028">2027-2028</option>
        </select>
      </div>
    </div>
    <button class="btn" onclick="consulterBulletinParent()">Afficher le Bulletin</button>
    <div id="zone-bulletin-parent" style="margin-top: 15px;"></div>
  </div>

  <script>
    async function consulterBulletinParent() {
      const nom = document.getElementById('parent-search-eleve').value.trim().toLowerCase();
      const annee = document.getElementById('parent-annee').value;
      const zone = document.getElementById('zone-bulletin-parent');

      if (!nom) { alert("Veuillez entrer le nom complet de votre enfant."); return; }

      const cle_unique = `${nom}_${annee}`;
      const { data, error } = await supabaseClient.from('bulletins').select('*').eq('cle_unique', cle_unique).single();

      if (error || !data) {
        zone.innerHTML = `<p style="color:#dc3545; text-align:center;">Aucun bulletin disponible pour "<strong>${nom}</strong>" (${annee}).</p>`;
        return;
      }

      const d = data;
      const n = d.notes || {};

      zone.innerHTML = `
        <div style="background:#fff; padding:20px; border:2px solid #198754; border-radius:8px;">
          <div style="text-align:center; border-bottom:2px solid #198754; padding-bottom:10px; margin-bottom:15px;">
            <h2 style="margin:0; font-size:1.2rem; color:#198754;">PASE CONNECT — BULLETIN D'ÉVALUATION</h2>
            <p style="margin:5px 0; font-size:0.85rem; color:#6c757d;">Année Scolaire ${d.annee} | ${d.periode}</p>
          </div>

          <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:15px;">
            <div><strong>Nom & Prénom :</strong> ${d.eleve}</div>
          </div>

          <table style="width:100%; border-collapse:collapse; margin-bottom:15px;">
            <thead>
              <tr style="background:#f8f9fa;">
                <th style="border:1px solid #000; padding:6px; text-align:left;">Champs de Formation</th>
                <th style="border:1px solid #000; padding:6px; text-align:center;">Note</th>
              </tr>
            </thead>
            <tbody>
              <tr><td style="border:1px solid #000; padding:6px;">Communication Orale</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.comm ?? '-'} / 10</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">Dictée</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.dictee ?? '-'} / 10</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">Expression Écrite</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.expr ?? '-'} / 10</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">Lecture</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.lect ?? '-'} / 10</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">Mathématique</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.maths ?? '-'} / 20</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">EST</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.est ?? '-'} / 10</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">ES</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.es ?? '-'} / 10</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">Art Plastique</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.artp ?? '-'} / 10</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">Art Vivant</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.artv ?? '-'} / 10</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">EPS</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.eps ?? '-'} / 10</strong></td></tr>
              <tr><td style="border:1px solid #000; padding:6px;">Anglais</td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${n.anglais ?? '-'} / 10</strong></td></tr>
              <tr style="background:#e9ecef;"><td style="border:1px solid #000; padding:6px;"><strong>Total Points</strong></td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${d.total} pts</strong></td></tr>
              <tr style="background:#e9ecef;"><td style="border:1px solid #000; padding:6px;"><strong>Seuil Atteint</strong></td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${d.seuil || '-'}</strong></td></tr>
              <tr style="background:#e9ecef;"><td style="border:1px solid #000; padding:6px;"><strong>Rang</strong></td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${d.rang || '-'}</strong></td></tr>
              <tr style="background:#e9ecef;"><td style="border:1px solid #000; padding:6px;"><strong>Observation</strong></td><td style="border:1px solid #000; padding:6px; text-align:center;"><strong>${d.obs || '-'}</strong></td></tr>
            </tbody>
          </table>
        </div>
        <button class="btn-pdf" onclick="window.print()">🖨️ Imprimer / Télécharger en PDF</button>
      `;
    }
  </script>

</body>
</html>
